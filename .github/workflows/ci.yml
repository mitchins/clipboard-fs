name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: SwiftLint
        run: |
          docker run --rm \
            -v "$(pwd):/work" -w /work \
            ghcr.io/realm/swiftlint:latest \
            swiftlint lint --reporter github-actions-logging

  # Runs on main push only — generates lcov coverage for Codecov and Xcode coverage XML for Sonar
  test:
    name: Test (macOS)
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test with coverage
        run: swift test --enable-code-coverage --filter "ClipboardFolderCoreTests|ClipboardFolderUITests|ClipboardFolderIntegrationTests"
      - name: Generate lcov coverage
        run: |
          PROFDATA=$(find .build -name "default.profdata" -o -name "Coverage.profdata" | head -1)
          TESTBIN=$(find .build -path "*.xctest/Contents/MacOS/ClipboardFolderPackageTests" | head -1)
          if [ -z "$PROFDATA" ] || [ -z "$TESTBIN" ]; then
            echo "Missing coverage inputs: PROFDATA=$PROFDATA TESTBIN=$TESTBIN"
            exit 1
          fi
          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile="$PROFDATA" \
            "$TESTBIN" \
            --ignore-filename-regex='\.build|Tests' \
            > coverage.lcov
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ${{ github.workspace }}
        run: xcodegen generate
      - name: Run Xcode tests with coverage
        working-directory: ${{ github.workspace }}
        run: xcodebuild test -project ClipboardFolder.xcodeproj -scheme ClipboardFolder -destination "platform=macOS" -enableCodeCoverage YES -resultBundlePath TestResults.xcresult -derivedDataPath DerivedData -only-testing:ClipboardFolderUITests -only-testing:ClipboardFolderAppUITests
      - name: Generate coverage XML
        run: |
          python3 Scripts/xccov_to_sonarqube_xml.py TestResults.xcresult coverage.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("coverage.xml")
          print("coverage.xml is well-formed")
          PY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@cddd853df119a48c5be31a973f8cd97e12e35e16 # v6.0.1
        with:
          files: coverage.lcov
          fail_ci_if_error: false

  # PR variant — approval-gated, produces coverage for Sonar
  test-pr:
    name: Test (macOS) [requires approval]
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    environment: macos-tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test --filter "ClipboardFolderCoreTests|ClipboardFolderUITests|ClipboardFolderIntegrationTests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ${{ github.workspace }}
        run: xcodegen generate
      - name: App UI tests
        working-directory: ${{ github.workspace }}
        run: xcodebuild test -project ClipboardFolder.xcodeproj -scheme ClipboardFolder -destination "platform=macOS" -enableCodeCoverage YES -resultBundlePath TestResults.xcresult -derivedDataPath DerivedData -only-testing:ClipboardFolderUITests -only-testing:ClipboardFolderAppUITests
      - name: Generate coverage XML
        run: |
          python3 Scripts/xccov_to_sonarqube_xml.py TestResults.xcresult coverage.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("coverage.xml")
          print("coverage.xml is well-formed")
          PY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  # Runs on both push and PR with coverage attached to the relevant test job:
  #   push to main  → waits for lint + test, scans with coverage
  #   PR            → waits for lint + approval-gated test-pr, scans with coverage
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [lint, test, test-pr]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      (
        (github.event_name == 'push' && needs.test.result == 'success') ||
        (github.event_name == 'pull_request' && needs['test-pr'].result == 'success')
      )
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download coverage artifact
        if: |
          (github.event_name == 'push' && needs.test.result == 'success') ||
          (github.event_name == 'pull_request' && needs['test-pr'].result == 'success')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: .
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
