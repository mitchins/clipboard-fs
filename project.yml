name: ClipboardFolder
options:
  fileTypes:
    "icon":
      file: true
  bundleIdPrefix: com.mitchellcurrie
configs:
  Debug: debug
  Release: release
settings:
  MARKETING_VERSION: $(MARKETING_VERSION)
  CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
targets:
  ClipboardFolderApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ClipboardFolder
    resources:
      - path: Sources/ClipboardFolder/Assets.xcassets/MenuBarIcon.imageset/MenuBarIcon.png
      - path: Sources/ClipboardFolder/Assets.xcassets/MenuBarIcon.imageset/MenuBarIcon@2x.png
      - path: Sources/ClipboardFolder/Assets.xcassets/MenuBarIcon.imageset/MenuBarIcon@3x.png
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/ClipboardFolder.entitlements
    dependencies:
      - package: ClipboardFolder
        product: ClipboardFolderUI
      - package: ClipboardFolder
        product: ClipboardFolderCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mitchellcurrie.clipboard-folder
      CODE_SIGN_STYLE: Automatic
      # Team ID is not hardcoded
  ClipboardFolderCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ClipboardFolderCoreTests
    dependencies:
      - package: ClipboardFolder
        product: ClipboardFolderCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
  ClipboardFolderIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ClipboardFolderIntegrationTests
    dependencies:
      - package: ClipboardFolder
        product: ClipboardFolderCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
  ClipboardFolderUITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ClipboardFolderUITests
    dependencies:
      - package: ClipboardFolder
        product: ClipboardFolderUI
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
  ClipboardFolderAppUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ClipboardFolderAppUITests
    dependencies:
      - target: ClipboardFolderApp
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  ClipboardFolder:
    build:
      targets:
        ClipboardFolderApp: all
    run:
      config: Debug
      targets:
        - ClipboardFolderApp
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ClipboardFolderCoreTests
        - ClipboardFolderIntegrationTests
        - ClipboardFolderUITests
        - ClipboardFolderAppUITests
    archive:
      config: Release
      targets:
        - ClipboardFolderApp
packages:
  ClipboardFolder:
    path: .
